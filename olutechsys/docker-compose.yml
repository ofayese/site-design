services:
  olutechsys:
    image: nginx:alpine
    container_name: olutechsys
    ports:
      - "8080:80"
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

# Run:  docker compose up -d
# Open: http://localhost:8080
# Stop: docker compose down
